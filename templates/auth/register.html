{% extends "base_auth.html" %}
{% block title %}Inscription - OCR Présence{% endblock %}

{% block extra_css %}
<style>
    .register-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .register-card h1 {
        color: #1f4e79;
        text-align: center;
        margin-bottom: 10px;
        font-size: 24px;
    }
    .register-card p.subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: #333;
        font-weight: 600;
        font-size: 13px;
    }
    .form-group input,
    .form-group select {
        width: 100%;
        padding: 11px 14px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
        font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #2e75b6;
    }
    .btn-register {
        width: 100%;
        padding: 14px;
        background: #2e75b6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }
    .btn-register:hover { background: #1f4e79; }
    .links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #777;
    }
    .links a { color: #2e75b6; text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="register-card">
    <h1>📝 Inscription</h1>
    <p class="subtitle">Créer un nouveau compte</p>
    
    <form method="POST">
        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" name="full_name" required>
        </div>
        
        <div class="form-group">
            <label>Nom d'utilisateur</label>
            <input type="text" name="username" required>
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" required minlength="6">
        </div>
        
        <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" name="confirm_password" required minlength="6">
        </div>
        
        <div class="form-group">
            <label>Rôle</label>
            <select name="role">
                <option value="user">Utilisateur (Employé)</option>
                <option value="admin">Administrateur (RH)</option>
            </select>
        </div>
        
        <button type="submit" class="btn-register">Créer le compte</button>
    </form>
    
    <div class="links">
        Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a>
    </div>
</div>
{% endblock %}
