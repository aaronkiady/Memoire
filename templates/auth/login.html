{% extends "base_auth.html" %}
{% block title %}Connexion - OCR Présence{% endblock %}

{% block extra_css %}
<style>
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-card h1 {
        color: #1f4e79;
        text-align: center;
        margin-bottom: 10px;
        font-size: 24px;
    }
    .login-card p.subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
    }
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #2e75b6;
    }
    .btn-login {
        width: 100%;
        padding: 14px;
        background: #2e75b6;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }
    .btn-login:hover { background: #1f4e79; }
    .links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #777;
    }
    .links a { color: #2e75b6; text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #555;
        margin-bottom: 20px;
    }
    .remember input { width: auto; }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
    <h1>🔐 Connexion</h1>
    <p class="subtitle">Système de présence OCR</p>
    
    <form method="POST">
        <div class="form-group">
            <label>👤 Nom d'utilisateur</label>
            <input type="text" name="username" required autofocus>
        </div>
        
        <div class="form-group">
            <label>🔒 Mot de passe</label>
            <input type="password" name="password" required>
        </div>
        
        <div class="remember">
            <input type="checkbox" name="remember" id="remember">
            <label for="remember">Se souvenir de moi</label>
        </div>
        
        <button type="submit" class="btn-login">Se connecter</button>
    </form>
</div>
{% endblock %}
