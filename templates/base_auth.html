<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OCR Présence{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1f4e79, #2e75b6);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        /* Flash messages */
        .flash-messages {
            margin-bottom: 20px;
            width: 100%;
        }
        .flash {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .flash.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .flash.error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .flash.info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        .flash.warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div style="width: 100%; max-width: 450px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
