<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OCR Présence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1f4e79, #2e75b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #1f4e79;
            font-size: 22px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #bbb;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #2e75b6;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2e75b6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1f4e79;
        }

        .hint {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📋 OCR – Présence quotidienne</h1>
        <p>
           Un fichier Excel sera généré automatiquement.</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="images" accept="image/*" multiple required>
            <button type="submit">📥 Générer le fichier Excel</button>
        </form>

        <div class="hint">
            Formats acceptés: JPG, PNG .
        </div>
    </div>

</body>
</html>
